sensor_pin: P0.24
#control: pid
#pid_Kp: 16.948
#pid_Ki: 0.706
#pid_Kd: 101.960
min_temp: 0
max_temp: 300
pressure_advance: 0.075 #gammel_verdi 0.075 utregnet verdi: 0.895
max_extrude_cross_section: 500

[heater_bed]
heater_pin: P2.5
sensor_type: EPCOS 100K B57560G104F
sensor_pin: P0.25
#control: pid
#pid_Kp: 129.42
#pid_Ki: 19.8
#pid_Kd: 563.97
min_temp: 0
max_temp: 130

[bed_screws]
screw1: 35, 35
screw2: 205, 35
screw3: 35, 205
screw4: 205, 205

