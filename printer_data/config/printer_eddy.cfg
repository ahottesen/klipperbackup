# This file contains common pin mappings for BIQU B1 printer with
# BIGTREETECH SKR V1.4 board from 2020.
# To use this config, the firmware should be compiled for the LPC1768

# See docs/Config_Reference.md for a description of parameters.

[stepper_x]
step_pin: P2.2
dir_pin: !P2.6
enable_pin: !P2.1
microsteps: 128
rotation_distance: 39.90 #40
endstop_pin: !P1.29
position_endstop: -2.5
position_max: 232
position_min: -2.5 #-5
homing_speed: 50

[stepper_y]
step_pin: P0.19
dir_pin: P0.20
enable_pin: !P2.8
microsteps: 128
rotation_distance: 39.93 #40
endstop_pin: !P1.28
position_endstop: -8
position_max: 227
position_min: -8
homing_speed: 50

# BL-Touch
[stepper_z]
step_pin: P0.22
dir_pin: P2.11
enable_pin: !P0.21
microsteps: 128
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_max: 275
position_min: -8.5


[stepper_z1]
microsteps: 128
step_pin: P1.15
dir_pin: P1.14
enable_pin: !P1.16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop

[extruder]
step_pin: P2.13
dir_pin: P0.11
enable_pin: !P2.12
microsteps: 128 #128
rotation_distance: 3.4334
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: P2.7
