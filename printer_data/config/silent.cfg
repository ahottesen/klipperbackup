[input_shaper]
shaper_freq_x: 53.2
shaper_type_x: mzv
shaper_freq_y: 42.6
shaper_type_y: mzv


########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: P1.10
run_current: 0.800
#hold_current: 0.500
#interpolate: False
stealthchop_threshold: 999999

[tmc2209 stepper_y]
uart_pin: P1.9
run_current: 0.800
#hold_current: 0.500
#interpolate: False
stealthchop_threshold: 999999

[tmc2209 stepper_z]
uart_pin: P1.8
run_current: 0.8
#hold_current: 0.450
stealthchop_threshold: 999999

[tmc2209 stepper_z1]
uart_pin: P1.1
interpolate: True
run_current: 0.8
#hold_current: 0.450
stealthchop_threshold: 999999 

[tmc2209 extruder]
uart_pin: P1.4
run_current: 0.800
#hold_current: 0.500
#interpolate: False
stealthchop_threshold: 999999