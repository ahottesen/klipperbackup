######################################################################
# PID tuning
######################################################################
[gcode_macro PID_EXTRUDER] description: PID Tune for the Extruder gcode:
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(210)|float %}
  PID_CALIBRATE HEATER=extruder TARGET=230
  TURN_OFF_HEATERS 
  SAVE_CONFIG

[gcode_macro PID_BED] description: PID Tune for the Bed gcode:
gcode:
  {% set TARGET_TEMP = params.TARGET_TEMP|default(60)|float %}
  PID_CALIBRATE HEATER=heater_bed TARGET=80
  TURN_OFF_HEATERS
  SAVE_CONFIG


######################################################################
# Z-Tilt
######################################################################
[z_tilt]
z_positions: 0,117.5 #42
            205,117.5
points: 10,117.5 #-2.5
        220,117.5 #207
speed: 150
horizontal_move_z: 4
retries: 10
retry_tolerance: 0.050

######################################################################
# Start Print and End Print
######################################################################

# Replace the slicer's custom start and end g-code scripts with
# START_PRINT and END_PRINT.

[gcode_macro START_PRINT]
gcode:
    {% set bed_temp = params.BED|default(60)|float %}
    {% set extruder_temp = params.EXTRUDER|default(200)|float %}

    SET_LED LED="LED" RED=1 GREEN=0 BLUE=0 SYNC=0 INDEX=1
    SET_LED LED="LED" RED=1 GREEN=0 BLUE=0 SYNC=0 INDEX=2 TRANSMIT=1

    M117 Preheating nozzle to 150°C for probing...
    M104 S150

    M117 Heating bed...
    M140 S{bed_temp}
    M190 S{bed_temp}

    G28
    Z_TILT_ADJUST
    G1 X125 Y125 F3000
    
    PROBE_EDDY_NG_TAP

    M117 Heating nozzle to final temp...
    M104 S{extruder_temp}
    M109 S{extruder_temp}

    BED_MESH_CALIBRATE METHOD=rapid_scan
	NOZZLE_WIPE
    LINE_PURGE
    BED_MESH_PROFILE LOAD="default"

    G92 E0
    G1 Z2.0 F3000

    SET_LED LED="LED" RED=1 GREEN=1 BLUE=1 SYNC=0 INDEX=1
    SET_LED LED="LED" RED=1 GREEN=1 BLUE=1 SYNC=0 INDEX=2 TRANSMIT=1

    #SKEW_PROFILE LOAD=my_skew_profile


[gcode_macro END_PRINT]
gcode:
    SET_SKEW CLEAR=1
    M104 S0                                ;extruder heater off
    M140 S0                                ;heated bed heater off (if you have it)
    G91                                    ;relative positioning
    G1 E-1 F300                            ;retract the filament a bit before lifting the nozzle, to release some of the pressure
    #G1 Z+0.5 E-2 F1500                     ;move Z up a bit and retract filament even more
    G90                                    ;absolute positioning
    G0 X0 Y220 F1000                 ;present print
    M84                                    ;steppers off
    M106 S255                         ;fan to full speed for 3 minutes
    G4 S180
    M106 S1                            ;fan off
    SET_LED LED="LED" RED=0 GREEN=1 BLUE=0 SYNC=0 INDEX=1
    SET_LED LED="LED" RED=0 GREEN=1 BLUE=0 SYNC=0 INDEX=2 TRANSMIT=1
    UPDATE_DELAYED_GCODE ID=POWER_OFF_PRINTER_CHECK DURATION=30


######################################################################
# Filament Change
######################################################################

# M600: Filament Change. This macro will pause the printer, move the
# tool to the change position, and retract the filament 50mm. Adjust
# the retraction settings for your own extruder. After filament has
# been changed, the print can be resumed from its previous position
# with the "RESUME" gcode.

[pause_resume]

[gcode_macro M600]
gcode:
    {% set X = params.X|default(50)|float %}
    {% set Y = params.Y|default(0)|float %}
    {% set Z = params.Z|default(10)|float %}
    SAVE_GCODE_STATE NAME=M600_state
    PAUSE
    G91
    G1 E-.8 F2700
    G1 Z{Z}
    G90
    G1 X{X} Y{Y} F3000
    G91
    G1 E-50 F1000
    RESTORE_GCODE_STATE NAME=M600_state

######################################################################
# Load / Unload Filament (KlipperScreen)
######################################################################
[gcode_macro LOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=load_state
    M300 # beep
    G91
    G92 E0
    G1 E350 F{max_velocity} # fast-load
    G1 E25 F{speed} # purge
    M300
    M300
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    M300 # beep
    G92 E0
    G1 E25 F{speed} # purge
    G1 E-420 F{max_velocity} # fast-unload
    M300
    M300
    RESTORE_GCODE_STATE NAME=unload_state

######################################################################
# Maintenance
######################################################################
# Move the toolhead to 1/2 max above the bed and the front centre
#
[gcode_macro MAINTENANCE]
description: move the toolhead to a convenient position for working on it
gcode:

  {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
  {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}

  {% set mid_x = max_x / 2.0 %}
  {% set z50 = max_z * 0.5 %}

  STATUS_BUSY
  HOME_IF_NEEDED
  G0 X{mid_x} Y0 Z{z50} F10000
  M84
  STATUS_MAINTENANCE


